name: Deploy Zola to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync dynamic CMS to Markdown & static
        run: |
          node scripts/sync-static.js
          mkdir -p static/data static/admin static/js
          cp -r data/* static/data/ 2>/dev/null || true
          cp -r public/admin/* static/admin/ 2>/dev/null || true
          cp -r public/js/* static/js/ 2>/dev/null || true

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola

      - name: Build with Zola (minified)
        run: zola build --minify

      - name: Verify dynamic CMS assets in build
        run: |
          mkdir -p public/admin public/data public/js public/static
          cp -r static/admin/* public/admin/ 2>/dev/null || true
          cp data/portfolio-data.json public/data/portfolio-data.json 2>/dev/null || true
          cp static/js/dynamic-site.js public/js/dynamic-site.js 2>/dev/null || true
          cp -r public/css public/static/css 2>/dev/null || true
          cp -r public/images public/static/images 2>/dev/null || true
          cp -r public/js public/static/js 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
