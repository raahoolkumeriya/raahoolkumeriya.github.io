{% extends "base.html" %}

{% block title %}404 Not Found | {{ config.title }}{% endblock title %}

{% block content %}
<section class="section" style="min-height: 70vh; display: flex; align-items: center;">
  <div class="container" style="text-align: center; max-width: 640px;">
    <div class="card card-featured not-found-card">
      <span class="card-badge badge-purple" style="margin-bottom: 1.5rem;">
        Error 404
      </span>
      <h1 class="gradient-text not-found-code">
        404
      </h1>
      <h2 style="margin-bottom: 1rem;">Page Not Found</h2>
      <p style="margin-bottom: 2.5rem; color: var(--text-secondary); max-width: 480px;">
        The blueprint or page you are looking for might have been migrated, updated, or does not exist.
      </p>
      <a class="btn btn-primary" href="{{ config.base_url }}/">
        <span>Return to Homepage</span>
        <span class="arrow-icon">➔</span>
      </a>
    </div>
  </div>
</section>
{% endblock content %}
